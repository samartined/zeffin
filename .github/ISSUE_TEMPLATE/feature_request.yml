name: Feature request
description: An idea for something Zeffin should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task or the problem, as you would do it with the Flipper and the agent today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How Zeffin could make it possible or easier.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Alternatives you tried, screenshots or mockups (without personal data).
